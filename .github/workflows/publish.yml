# Publishes to PyPI via Trusted Publishing (OIDC) — no API token stored in GitHub.
# PyPI side: https://pypi.org/manage/project/cover_letter_automation/settings/publishing/
#   owner=shippy, repo=cover_letter_automation, workflow=publish.yml, environment=pypi
name: Publish package

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # `pypi` environment: required reviewer + only tags matching v* (tags are admin-only via ruleset).
    environment:
      name: pypi
      url: https://pypi.org/p/cover_letter_automation
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.8"

      - name: Install Poetry
        run: pip install --no-input poetry==1.7.1

      - name: Build
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
